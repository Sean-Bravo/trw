<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="orange1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#D97706" opacity="0.08"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid3)"/>

  <!-- Left side: The old way (crossed out) -->
  <g transform="translate(80, 100)">
    <text x="0" y="0" font-family="sans-serif" font-size="15" fill="#DC2626" font-weight="700" letter-spacing="2" opacity="0.7">THE OLD WAY</text>

    <!-- Stack of parser files -->
    <g transform="translate(0, 30)">
      <rect width="220" height="52" rx="10" fill="white" stroke="#FCA5A5" stroke-width="1.5" opacity="0.7"/>
      <text x="16" y="20" font-family="monospace" font-size="12" fill="#94A3B8">coinbase_parser.py</text>
      <text x="16" y="38" font-family="monospace" font-size="11" fill="#DC2626">⚠ Format changed</text>
    </g>

    <g transform="translate(20, 92)">
      <rect width="220" height="52" rx="10" fill="white" stroke="#FCA5A5" stroke-width="1.5" opacity="0.7"/>
      <text x="16" y="20" font-family="monospace" font-size="12" fill="#94A3B8">binance_parser.py</text>
      <text x="16" y="38" font-family="monospace" font-size="11" fill="#DC2626">⚠ Missing columns</text>
    </g>

    <g transform="translate(40, 154)">
      <rect width="220" height="52" rx="10" fill="white" stroke="#FCA5A5" stroke-width="1.5" opacity="0.7"/>
      <text x="16" y="20" font-family="monospace" font-size="12" fill="#94A3B8">kraken_parser.py</text>
      <text x="16" y="38" font-family="monospace" font-size="11" fill="#DC2626">⚠ Date parse error</text>
    </g>

    <g transform="translate(60, 216)">
      <rect width="220" height="52" rx="10" fill="white" stroke="#FCA5A5" stroke-width="1.5" opacity="0.7"/>
      <text x="16" y="20" font-family="monospace" font-size="12" fill="#94A3B8">gemini_parser.py</text>
      <text x="16" y="38" font-family="monospace" font-size="11" fill="#DC2626">⚠ Duplicate rows</text>
    </g>

    <g transform="translate(80, 278)">
      <rect width="220" height="52" rx="10" fill="white" stroke="#FCA5A5" stroke-width="1.5" opacity="0.7"/>
      <text x="16" y="20" font-family="monospace" font-size="12" fill="#94A3B8">chase_pdf_ocr.py</text>
      <text x="16" y="38" font-family="monospace" font-size="11" fill="#DC2626">⚠ OCR accuracy</text>
    </g>

    <g transform="translate(100, 340)">
      <rect width="220" height="52" rx="10" fill="white" stroke="#E2E8F0" stroke-width="1.5" opacity="0.4"/>
      <text x="16" y="32" font-family="monospace" font-size="12" fill="#CBD5E1">+ 9 more parsers...</text>
    </g>

    <!-- Big X -->
    <line x1="30" y1="20" x2="330" y2="400" stroke="#DC2626" stroke-width="4" opacity="0.2"/>
    <line x1="330" y1="20" x2="30" y2="400" stroke="#DC2626" stroke-width="4" opacity="0.2"/>

    <!-- Cost label -->
    <g transform="translate(60, 420)">
      <rect width="200" height="44" rx="8" fill="#FEE2E2" opacity="0.8"/>
      <text x="100" y="28" font-family="sans-serif" font-size="14" fill="#DC2626" font-weight="700" text-anchor="middle">300+ engineering hours</text>
    </g>
  </g>

  <!-- Center arrow -->
  <g transform="translate(530, 280)">
    <rect width="140" height="60" rx="30" fill="url(#orange1)" filter="drop-shadow(0 4px 12px rgba(245,158,11,0.3))"/>
    <text x="70" y="36" font-family="sans-serif" font-size="26" fill="white" font-weight="700" text-anchor="middle">→</text>
  </g>

  <!-- Right side: The API way -->
  <g transform="translate(740, 100)">
    <text x="0" y="0" font-family="sans-serif" font-size="15" fill="#16A34A" font-weight="700" letter-spacing="2" opacity="0.7">THE API WAY</text>

    <!-- Single API card -->
    <g transform="translate(0, 30)">
      <rect width="360" height="340" rx="16" fill="white" stroke="#BBF7D0" stroke-width="2" filter="drop-shadow(0 8px 24px rgba(0,0,0,0.08))"/>

      <!-- Header -->
      <rect width="360" height="64" rx="16" fill="#F0FDF4"/>
      <rect y="48" width="360" height="16" fill="#F0FDF4"/>
      <text x="24" y="42" font-family="monospace" font-size="16" fill="#16A34A" font-weight="700">POST /v1/parse</text>
      <rect x="240" y="20" width="96" height="28" rx="14" fill="#16A34A"/>
      <text x="288" y="39" font-family="sans-serif" font-size="12" fill="white" font-weight="600" text-anchor="middle">One call</text>

      <!-- Features list -->
      <text x="24" y="100" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="600">✓</text>
      <text x="44" y="100" font-family="sans-serif" font-size="14" fill="#1E293B">14 crypto exchanges</text>

      <text x="24" y="132" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="600">✓</text>
      <text x="44" y="132" font-family="sans-serif" font-size="14" fill="#1E293B">50+ bank formats</text>

      <text x="24" y="164" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="600">✓</text>
      <text x="44" y="164" font-family="sans-serif" font-size="14" fill="#1E293B">Automatic format detection</text>

      <text x="24" y="196" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="600">✓</text>
      <text x="44" y="196" font-family="sans-serif" font-size="14" fill="#1E293B">OCR for scanned PDFs</text>

      <text x="24" y="228" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="600">✓</text>
      <text x="44" y="228" font-family="sans-serif" font-size="14" fill="#1E293B">Date normalization</text>

      <text x="24" y="260" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="600">✓</text>
      <text x="44" y="260" font-family="sans-serif" font-size="14" fill="#1E293B">Duplicate detection</text>

      <text x="24" y="292" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="600">✓</text>
      <text x="44" y="292" font-family="sans-serif" font-size="14" fill="#1E293B">Zero maintenance</text>

      <text x="24" y="324" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="600">✓</text>
      <text x="44" y="324" font-family="sans-serif" font-size="14" fill="#1E293B">MCP server included</text>
    </g>

    <!-- Cost label -->
    <g transform="translate(80, 400)">
      <rect width="200" height="44" rx="8" fill="#DCFCE7"/>
      <text x="100" y="28" font-family="sans-serif" font-size="14" fill="#16A34A" font-weight="700" text-anchor="middle">$29/mo — done</text>
    </g>
  </g>

  <!-- Decorative -->
  <circle cx="600" cy="580" r="60" fill="#F59E0B" opacity="0.06"/>
  <circle cx="1160" cy="60" r="30" fill="#16A34A" opacity="0.06"/>
</svg>