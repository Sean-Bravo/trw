<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="indigoL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <pattern id="gridL" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#4338CA" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bgL)"/>
  <rect width="1200" height="630" fill="url(#gridL)"/>

  <!-- Left: a statement PDF becoming rows -->
  <g transform="translate(90, 120)">
    <text x="0" y="0" font-family="sans-serif" font-size="15" fill="#4338CA" font-weight="700" letter-spacing="2" opacity="0.8">BANK STATEMENT PDF</text>
    <g transform="translate(0, 24)">
      <rect width="300" height="200" rx="14" fill="white" stroke="#C7D2FE" stroke-width="1.5"/>
      <rect x="20" y="22" width="150" height="10" rx="5" fill="#CBD5E1"/>
      <rect x="20" y="52" width="260" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="20" y="74" width="230" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="20" y="96" width="250" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="20" y="118" width="200" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="20" y="140" width="240" height="8" rx="4" fill="#E2E8F0"/>
      <rect x="20" y="162" width="180" height="8" rx="4" fill="#E2E8F0"/>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(430, 240)">
    <path d="M0 0 H120" stroke="url(#indigoL)" stroke-width="6" stroke-linecap="round"/>
    <path d="M100 -18 L124 0 L100 18" stroke="url(#indigoL)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Right: clean rows -->
  <g transform="translate(600, 120)">
    <text x="0" y="0" font-family="sans-serif" font-size="15" fill="#4338CA" font-weight="700" letter-spacing="2" opacity="0.8">CLEAN SPREADSHEET</text>
    <g transform="translate(0, 24)">
      <rect width="500" height="200" rx="14" fill="white" stroke="#C7D2FE" stroke-width="1.5"/>
      <text x="22" y="34" font-family="monospace" font-size="13" fill="#94A3B8">Date        Description          Amount</text>
      <line x1="16" y1="46" x2="484" y2="46" stroke="#E2E8F0"/>
      <text x="22" y="74" font-family="monospace" font-size="13" fill="#334155">2025-01-03  PAYROLL DEPOSIT     +3,200.00</text>
      <text x="22" y="102" font-family="monospace" font-size="13" fill="#334155">2025-01-05  WHOLE FOODS #10092     -87.43</text>
      <text x="22" y="130" font-family="monospace" font-size="13" fill="#334155">2025-01-07  TRANSFER TO SAVINGS   -500.00</text>
      <text x="22" y="158" font-family="monospace" font-size="13" fill="#334155">2025-01-09  NETFLIX.COM            -15.49</text>
      <text x="22" y="186" font-family="monospace" font-size="13" fill="#94A3B8">…</text>
    </g>
  </g>

  <!-- Bottom: three badges -->
  <g transform="translate(90, 420)" font-family="sans-serif" font-size="16" font-weight="600">
    <rect width="300" height="54" rx="27" fill="white" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="150" y="34" text-anchor="middle" fill="#4338CA">Bank statement page</text>
    <rect x="330" width="300" height="54" rx="27" fill="white" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="480" y="34" text-anchor="middle" fill="#4338CA">Parser fixes, with numbers</text>
    <rect x="660" width="360" height="54" rx="27" fill="white" stroke="#C7D2FE" stroke-width="1.5"/>
    <text x="840" y="34" text-anchor="middle" fill="#4338CA">Versioned results in every response</text>
  </g>

  <text x="90" y="560" font-family="sans-serif" font-size="22" font-weight="700" fill="#1E1B4B">What changed on TaxFormatter since May</text>
  <text x="90" y="590" font-family="sans-serif" font-size="15" fill="#64748B">Launch-week update · October 2026</text>
</svg>
