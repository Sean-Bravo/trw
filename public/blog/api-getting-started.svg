<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="blue1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg1)"/>

  <!-- Subtle grid -->
  <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="20" cy="20" r="1" fill="#94A3B8" opacity="0.15"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid1)"/>

  <!-- Terminal window -->
  <rect x="120" y="100" width="520" height="430" rx="16" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  <rect x="120" y="100" width="520" height="48" rx="16" fill="#334155"/>
  <rect x="120" y="132" width="520" height="16" fill="#334155"/>
  <circle cx="152" cy="124" r="8" fill="#EF4444" opacity="0.8"/>
  <circle cx="176" cy="124" r="8" fill="#F59E0B" opacity="0.8"/>
  <circle cx="200" cy="124" r="8" fill="#22C55E" opacity="0.8"/>

  <!-- Terminal text lines -->
  <text x="148" y="185" font-family="monospace" font-size="14" fill="#94A3B8">$</text>
  <text x="168" y="185" font-family="monospace" font-size="14" fill="#22C55E">curl</text>
  <text x="210" y="185" font-family="monospace" font-size="14" fill="#E2E8F0">-X POST</text>

  <text x="148" y="210" font-family="monospace" font-size="14" fill="#60A5FA">  https://api.taxformatter.com</text>
  <text x="148" y="235" font-family="monospace" font-size="14" fill="#94A3B8">  /v1/parse</text>

  <text x="148" y="275" font-family="monospace" font-size="13" fill="#94A3B8">Response:</text>
  <text x="148" y="300" font-family="monospace" font-size="13" fill="#F59E0B">{"</text><text x="170" y="300" font-family="monospace" font-size="13" fill="#60A5FA">transactions</text><text x="288" y="300" font-family="monospace" font-size="13" fill="#F59E0B">":</text>
  <text x="168" y="325" font-family="monospace" font-size="13" fill="#E2E8F0">[</text>
  <text x="188" y="350" font-family="monospace" font-size="13" fill="#F59E0B">{"</text><text x="210" y="350" font-family="monospace" font-size="13" fill="#60A5FA">type</text><text x="250" y="350" font-family="monospace" font-size="13" fill="#F59E0B">":</text><text x="265" y="350" font-family="monospace" font-size="13" fill="#22C55E">"buy"</text><text x="310" y="350" font-family="monospace" font-size="13" fill="#E2E8F0">,</text>
  <text x="198" y="375" font-family="monospace" font-size="13" fill="#F59E0B">"</text><text x="208" y="375" font-family="monospace" font-size="13" fill="#60A5FA">amount</text><text x="270" y="375" font-family="monospace" font-size="13" fill="#F59E0B">":</text><text x="285" y="375" font-family="monospace" font-size="13" fill="#C084FC">0.5</text><text x="315" y="375" font-family="monospace" font-size="13" fill="#E2E8F0">,</text>
  <text x="198" y="400" font-family="monospace" font-size="13" fill="#F59E0B">"</text><text x="208" y="400" font-family="monospace" font-size="13" fill="#60A5FA">currency</text><text x="286" y="400" font-family="monospace" font-size="13" fill="#F59E0B">":</text><text x="301" y="400" font-family="monospace" font-size="13" fill="#22C55E">"BTC"</text>
  <text x="188" y="425" font-family="monospace" font-size="13" fill="#F59E0B">}</text>
  <text x="168" y="450" font-family="monospace" font-size="13" fill="#E2E8F0">]</text>
  <text x="148" y="475" font-family="monospace" font-size="13" fill="#F59E0B">}</text>

  <!-- Blinking cursor -->
  <rect x="148" y="492" width="10" height="18" fill="#22C55E" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Right side: floating cards -->

  <!-- CSV file card -->
  <g transform="translate(720, 120)">
    <rect width="180" height="110" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.08))"/>
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#DBEAFE"/>
    <text x="28" y="43" font-family="monospace" font-size="16" fill="#3B82F6" font-weight="bold">.csv</text>
    <text x="68" y="35" font-family="sans-serif" font-size="13" fill="#1E293B" font-weight="600">coinbase.csv</text>
    <text x="68" y="52" font-family="sans-serif" font-size="11" fill="#94A3B8">847 transactions</text>
    <rect x="16" y="72" width="148" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="16" y="72" width="120" height="4" rx="2" fill="#3B82F6"/>
    <text x="16" y="96" font-family="sans-serif" font-size="11" fill="#22C55E" font-weight="600">✓ Parsed</text>
  </g>

  <!-- PDF file card -->
  <g transform="translate(760, 260)">
    <rect width="180" height="110" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.08))"/>
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#FEF3C7"/>
    <text x="24" y="43" font-family="monospace" font-size="16" fill="#D97706" font-weight="bold">.pdf</text>
    <text x="68" y="35" font-family="sans-serif" font-size="13" fill="#1E293B" font-weight="600">chase_stmt.pdf</text>
    <text x="68" y="52" font-family="sans-serif" font-size="11" fill="#94A3B8">134 transactions</text>
    <rect x="16" y="72" width="148" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="16" y="72" width="90" height="4" rx="2" fill="#F59E0B"/>
    <text x="16" y="96" font-family="sans-serif" font-size="11" fill="#3B82F6" font-weight="600">⟳ Processing...</text>
  </g>

  <!-- JSON output card -->
  <g transform="translate(700, 400)">
    <rect width="200" height="110" rx="12" fill="white" stroke="#E2E8F0" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.08))"/>
    <rect x="16" y="16" width="40" height="40" rx="8" fill="#DCFCE7"/>
    <text x="22" y="43" font-family="monospace" font-size="14" fill="#16A34A" font-weight="bold">JSON</text>
    <text x="68" y="35" font-family="sans-serif" font-size="13" fill="#1E293B" font-weight="600">Structured Data</text>
    <text x="68" y="52" font-family="sans-serif" font-size="11" fill="#94A3B8">Clean • Normalized</text>
    <text x="16" y="88" font-family="monospace" font-size="12" fill="#64748B">14 exchanges • 50+ banks</text>
  </g>

  <!-- Connecting arrows -->
  <path d="M 810 230 L 680 300" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>
  <path d="M 850 370 L 750 400" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- API badge -->
  <g transform="translate(960, 140)">
    <rect width="120" height="40" rx="20" fill="url(#blue1)"/>
    <text x="60" y="26" font-family="sans-serif" font-size="15" fill="white" font-weight="700" text-anchor="middle">REST API</text>
  </g>

  <!-- Decorative circles -->
  <circle cx="1100" cy="550" r="60" fill="#3B82F6" opacity="0.06"/>
  <circle cx="1140" cy="80" r="40" fill="#F59E0B" opacity="0.08"/>
  <circle cx="80" cy="580" r="30" fill="#3B82F6" opacity="0.06"/>
</svg>