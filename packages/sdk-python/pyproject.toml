[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxformatter"
version = "0.1.0"
description = "Official Python SDK for the TaxFormatter API — parse crypto CSVs and bank statement PDFs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "TaxFormatter", email = "support@taxformatter.com" }]
keywords = ["taxformatter", "crypto-tax", "csv-parser", "bank-statement", "pdf-parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["requests>=2.28"]

[project.urls]
Homepage = "https://taxformatter.com"
Documentation = "https://taxformatter.com/docs/api"
Repository = "https://github.com/Sean-Bravo/trw"
Issues = "https://github.com/Sean-Bravo/trw/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
