name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --passWithNoTests

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false

  backend-test:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned Lambda manifests cover the real data libs the tests need
      # (numpy/pandas/chardet/pdfplumber/PyYAML + anthropic). boto3/psycopg2
      # are mocked in-test; the Gemini path uses REST (no SDK).
      - name: Install backend + test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-api.txt -r backend/requirements-processor.txt
          pip install pytest pytest-cov

      # Tests import handlers/services as top-level packages, so run from backend/.
      - name: Run backend test suite
        run: python -m pytest tests/
        working-directory: backend

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Ongoing-2: npm audit policy.
      #
      # We currently have 5 high-severity transitive vulnerabilities in
      # dependencies that have no fix available yet (fast-xml-parser,
      # flatted, picomatch, vite, @aws-sdk/xml-builder). These warn only.
      #
      # Critical-severity always fails the build. Once the upstream
      # patches land, change `--audit-level=high` below to remove the
      # `continue-on-error: true` and the warn-only step disappears.
      - name: Run npm audit (high — warn only, blocked on upstream patches)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Run npm audit (critical — must pass)
        run: npm audit --audit-level=critical

      # M-11 / Ongoing-2: Python dependency vulnerability scan.
      # Pinned versions in backend/requirements-*.txt should keep this
      # green. If a new CVE drops, we want CI to fail loudly.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on Lambda requirements (must pass)
        run: |
          pip-audit -r backend/requirements-api.txt --vulnerability-service osv
          pip-audit -r backend/requirements-processor.txt --vulnerability-service osv
          pip-audit -r backend/requirements-webhook.txt --vulnerability-service osv

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://taxformatter.com
          SKIP_ENV_VALIDATION: true
