name: Publish Python SDK to PyPI

on:
  push:
    tags:
      # SDK releases use sdk-vX.Y.Z tags, decoupled from repo/app release
      # tags (e.g. v1.0.0). A plain v*.*.* tag here previously tried to
      # republish the SDK and failed on PyPI's duplicate-version check.
      - "sdk-v*.*.*"

jobs:
  test:
    name: Test Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk-python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pytest

      - name: Run tests
        run: pytest

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test]
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build
        run: pip install build

      - name: Build package
        run: python -m build
        working-directory: packages/sdk-python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/sdk-python/dist/
          # Safety net: skip (don't fail) if this version is already on PyPI.
          skip-existing: true
