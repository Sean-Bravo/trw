# configs/banks/bofa.yaml
bank:
  name: "Bank of America"
  aliases: ["BofA", "BOA", "Bank of America, N.A."]
  version: "1.0.0"
  updated_at: "2026-01-17"

fingerprint:
  logo_patterns: ["Bank of America", "bankofamerica.com"]
  header_patterns: ["Account Number", "Statement Period", "Account Summary"]
  unique_markers: ["Bank of America, N.A."]

table_detection:
  header_row_keywords: ["Date", "Description", "Amount", "Balance"]
  skip_rows_containing: ["Beginning Balance", "Ending Balance", "Page", "Total", "TOTALS", "continued"]

columns:
  date:
    names: ["Date", "Transaction Date", "Posted Date"]
    format: "MM/DD/YYYY"
  description:
    names: ["Description", "Transaction Description", "Payee"]
    max_length: 255
    multiline: true
  amount:
    names: ["Amount", "Withdrawals", "Deposits"]
    debit_credit_mode: true
  debit:
    names: ["Withdrawals", "Debits", "Checks"]
  credit:
    names: ["Deposits", "Credits", "Additions"]
  balance:
    names: ["Balance", "Running Balance", "Daily Balance"]

normalization:
  date_output: "YYYY-MM-DD"
  amount_sign: "negative_for_debits"

validation:
  balance_reconciliation: true
  date_sequence: true
